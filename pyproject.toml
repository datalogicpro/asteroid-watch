[project]
name = "asteroid-watch"
version = "0.1.0"
description = "Dashboard of asteroids and comets passing near Earth, impact risks, and fireballs, using NASA/JPL data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
exclude_gitignore = true
